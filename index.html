<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hymn Book</title>

    <meta
      name="description"
      content="Read hymns on your phone whenever you don't have a hymn book to hand. English, Xhosa, Setswana and Sesotho hymns with English translations, available offline."
    />
    <meta name="author" content="KatOre Solutions" />
    <!-- Matches the red used throughout the UI, so the mobile browser chrome
         and PWA splash stay consistent with the app. -->
    <meta name="theme-color" content="#E53935" />

    <!-- Icons. All generated from the same artwork the app renders in-product
         (src/assets/logo-v4.png), so tab, home-screen icon and share previews
         show one logo. The source is 376x308, so the square sizes below are
         letterboxed onto a white ground rather than stretched. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Without this, "Add to Home Screen" has no icon to use and Chrome falls
         back to a generic one. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Hymn Book" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Share previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hymn Book" />
    <meta property="og:title" content="Hymn Book" />
    <meta
      property="og:description"
      content="Read hymns on your phone whenever you don't have a hymn book to hand. English, Xhosa, Setswana and Sesotho hymns with English translations, available offline."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hymn Book" />
    <meta
      name="twitter:description"
      content="Read hymns on your phone whenever you don't have a hymn book to hand."
    />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <script>
      // Applies the theme before first paint, so a dark-mode user never sees a
      // white flash. Mirrors the seeding logic in AppContext.
      (function () {
        try {
          var saved = localStorage.getItem('mhb_dark_mode');
          var dark = saved !== null
            ? saved === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* storage blocked — default to light */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
